<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battiti</title>
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://127.0.0.1:* ws://localhost:*">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="/icon.svg" alt="" width="24" height="24"><span>Battiti</span></div>
  <nav class="crumbs" id="crumbs" aria-label="Path"></nav>
  <div class="seg" id="periods" role="group" aria-label="Period"></div>
  <div class="top-actions">
    <button class="ghost" id="pause">Pause</button>
    <button class="ghost" id="diag">Diagnostics</button>
    <button class="ghost icon" id="theme" aria-label="Change theme" title="Change theme"></button>
  </div>
</header>
<main id="view"></main>
<div id="toasts" role="status" aria-live="polite"></div>
<dialog id="dialog"></dialog>
<script src="/js/neutralino.js"></script>
<script type="module" src="/shared/startup.js"></script>
</body>
</html>
